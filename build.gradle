plugins {
	id 'java'
	id 'org.springframework.boot' version "${springBootVersion}"
	id 'io.spring.dependency-management' version "${springDependencyManagementVersion}"
}

group = 'com.sb.video'

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
    implementation "com.oracle.database.jdbc:ojdbc8:${oracleJdbcVersion}"
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation "org.springframework.boot:spring-boot-starter-aop"
    annotationProcessor 'org.projectlombok:lombok'

	//Supabase dependencies
	runtimeOnly 'org.postgresql:postgresql'

	//Cloudinary dependencies
	implementation "com.cloudinary:cloudinary-http44:${cloudinaryVersion}"

	//Swagger dependencies
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

	//JWT dependencies
	implementation "io.jsonwebtoken:jjwt-api:${jwtApiVersion}"
 	runtimeOnly "io.jsonwebtoken:jjwt-impl:${jwtImplVersion}"
 	runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jwtJacksonVersion}"

	//resilience4j dependencies
	implementation "io.github.resilience4j:resilience4j-spring-boot3:${resilience4jVersion}"

	//logback dependencies
	implementation "ch.qos.logback:logback-access:${logbackVersion}"
	implementation "ch.qos.logback:logback-classic:${logbackVersion}"
	implementation "ch.qos.logback:logback-core:${logbackVersion}"
	implementation 'net.logstash.logback:logstash-logback-encoder:7.4'

	//Jackson dependencies
	implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    //testImplementations
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'org.postgresql:postgresql'
    testImplementation "com.cloudinary:cloudinary-http44:${cloudinaryVersion}"
    testImplementation "com.oracle.database.jdbc:ojdbc8:${oracleJdbcVersion}"
}

tasks.named('test') {
	useJUnitPlatform()
}
