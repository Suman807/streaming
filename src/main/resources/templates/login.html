<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fafafa;
      --card-bg: #ffffff;
      --text: #202124;
      --muted: #5f6368;
      --brand: #1a73e8; /* Google-ish blue */
      --error: #d93025;
      --ring: rgba(26,115,232,0.25);
      --shadow: 0 10px 20px rgba(0,0,0,0.06), 0 2px 6px rgba(0,0,0,0.04);
      --radius: 16px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1115;
        --card-bg: #151821;
        --text: #e8eaed;
        --muted: #a1a6b0;
        --brand: #8ab4f8;
        --ring: rgba(138,180,248,0.25);
        --shadow: 0 10px 20px rgba(0,0,0,0.4), 0 2px 6px rgba(0,0,0,0.3);
      }
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      color: var(--text);
      background: radial-gradient(1200px 800px at 80% -10%, rgba(26,115,232,0.08), transparent 60%),
                  radial-gradient(1000px 700px at -10% 110%, rgba(52,168,83,0.07), transparent 55%),
                  var(--bg);
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 28px;
      animation: fadeIn 480ms ease-out;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px);} to { opacity: 1; transform: translateY(0);} }
    .brand {
      display: flex; align-items: center; gap: 10px; margin-bottom: 18px;
    }
    .brand-logo {
      width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, #1a73e8, #34a853);
      box-shadow: 0 2px 8px rgba(26,115,232,0.35);
    }
    .brand h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; margin: 0; }
    .subtitle { color: var(--muted); font-size: 14px; margin: 0 0 18px; }

    form { display: grid; gap: 14px; }
    label { font-size: 13px; font-weight: 600; margin-bottom: 6px; display: inline-block; }
    .field { display: grid; gap: 6px; }

    .input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid #dadce0;
      background: transparent;
      outline: none;
      transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
      font-size: 14px;
      color: var(--text);
    }
    .input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 4px var(--ring);
      background: rgba(26,115,232,0.02);
    }

    .actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 4px; }
    .remember { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }

    .btn {
      appearance: none; border: none; cursor: pointer;
      padding: 12px 16px; border-radius: 12px; font-weight: 600; font-size: 14px;
      background: var(--brand); color: white; box-shadow: 0 6px 14px rgba(26,115,232,0.3);
      transition: transform .06s ease, box-shadow .15s ease, opacity .15s ease;
    }
    .btn:hover { box-shadow: 0 8px 18px rgba(26,115,232,0.35); }
    .btn:active { transform: translateY(1px); }

    .btn-ghost {
      background: transparent; color: var(--brand);
      box-shadow: none; border: 1px solid rgba(26,115,232,.35);
    }
    .btn-ghost:hover { background: rgba(26,115,232,.06); }

    .divider { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; margin: 10px 0; color: var(--muted); font-size: 12px; }
    .divider::before, .divider::after { content: ""; height: 1px; background: #e0e3e7; }

    .error { display: none; background: rgba(217,48,37,0.08); border: 1px solid rgba(217,48,37,0.3);
             color: var(--error); border-radius: 12px; padding: 10px 12px; font-size: 13px; }
    .error[aria-hidden="false"] { display: block; }

    .footer { margin-top: 16px; display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; }
    a { color: var(--brand); text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main class="card" role="main">
    <div class="brand">
      <div class="brand-logo" aria-hidden="true"></div>
      <h1>Sign in</h1>
    </div>
    <p class="subtitle">to continue to Streamer</p>

    <!-- Global auth errors from Spring Security (e.g., bad credentials) -->
    <div class="error" th:if="${param.error}" aria-hidden="false" role="alert">
      Invalid username or password.
    </div>
    <div class="error" th:if="${param.logout}" aria-hidden="false" role="status">
      You have been signed out.
    </div>

    <form th:action="@{/login}" method="post" novalidate>
      <!-- CSRF token (Spring Security) -->
      <!-- <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" /> -->

      <div class="field">
        <label for="username">Email or username</label>
        <input id="username" name="username" class="input" type="text" autocomplete="username" required />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" class="input" type="password" autocomplete="current-password" required />
      </div>

      <div class="actions">
        <label class="remember">
          <input type="checkbox" name="remember-me" /> Remember me
        </label>
        <button type="submit" class="btn">Sign in</button>
      </div>

      <!--<div class="divider">or</div>-->

      <!-- Optional: OAuth2 Google login (works if you configured spring-security-oauth2-client) -->
      <!--<a class="btn btn-ghost" href="/oauth2/authorization/google">-->
      <!--  Continue with Google-->
      <!--</a>-->
    </form>

    <div class="footer">
      <a href="#">Forgot email?</a>
      <a href="#">Create account</a>
    </div>
  </main>
</body>
</html>
