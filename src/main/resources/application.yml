spring:
  application:
    name: streaming
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB


  datasource:
    url: jdbc:postgresql://aws-1-ap-southeast-1.pooler.supabase.com:5432/postgres?user={}&password={}
    driver-class-name: org.postgresql.Driver
    

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    # database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

management:
  health:
    circuitbreakers:
      enabled: true
  endpoints:
    web:
      base-path: "/"
      exposure:
        include:
        - health
        - info
        - actuator

  endpoint:
    health:
      show-details: always

files:
  video: videos/

frontend:
  url: http://localhost:5174

cloudinary:
  cloud_name: dnuicjonu
  api_key: 
  api_secret: 

jwt:
  secret: 
  expiration: 3600000 # 60 minutes in milliseconds  --> 1000ms * 60s * 60m


resilience4j:
  circuitbreaker:
    instances:
      cloudinaryCB: # Circuit breaker protecting Cloudinary API calls
        registerHealthIndicator: true # Expose circuit breaker status to Spring Health endpoint (/health)
        slidingWindowSize: 10 # Track last 10 calls to calculate failure rate
        failureRateThreshold: 50 # Open circuit if 50% of recent calls fail
        wait-duration-in-open-state: 20s # Wait 20 seconds before trying to recover (transition to HALF_OPEN)
        permitted-number-of-calls-in-half-open-state: 3 # Allow 3 test calls in HALF_OPEN state to check if service recovered

  retry: # Auto-retry logic for transient failures
    instances:
      cloudinaryRetry: # Retry configuration for Cloudinary API
        max-attempts: 3 # Retry failed requests up to 3 times total
        wait-duration: 2s # Wait 2 seconds between retry attempts (exponential backoff recommended in production)

  bulkhead: # Thread pool isolation to prevent cascading failures
    instances:
      cloudinaryBulkhead: # Bulkhead protecting Cloudinary thread pool
        max-concurrent-calls: 5 # Allow max 5 concurrent calls to Cloudinary API
        max-wait-duration: 5s # Wait max 5 seconds for a thread slot; reject if unavailable

  ratelimiter: # Rate limiting to prevent overwhelming Cloudinary API
    instances:
      cloudinaryRateLimiter: # Rate limiter for Cloudinary API calls
        timeout-duration: 5s # Wait up to 5 seconds to acquire permission to call Cloudinary API
        limit-refresh-period: 4s # Refill rate limiter tokens every 4 seconds
        limit-for-period: 10 # Allow max 10 calls to Cloudinary API per refresh

    

      
      